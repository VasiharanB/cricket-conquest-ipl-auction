services:
  - type: web
    name: cricket-conquest-backend
    runtime: node
    rootDir: server
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    plan: free
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: DEFAULT_PURSE
        value: "50.00"
      - key: MIN_SQUAD_SIZE
        value: "15"
      - key: MAX_SQUAD_SIZE
        value: "15"
      - key: MAX_TEAMS
        value: "40"
      - key: DB_SSL
        value: "true"
      # Cloud MySQL connection: set either DATABASE_URL or DB_HOST/DB_USER/DB_PASSWORD/DB_NAME
      - key: DATABASE_URL
        sync: false
